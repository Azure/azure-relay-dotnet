name: azure-relay-dotnet

on:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - '**\*.md'
  pull_request:
    branches:
      - master
      - dev
    paths-ignore:
      - '**\*.md'

jobs:
  build-windows:
    name: Build on windows-latest
    runs-on: 'windows-latest'

    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
    - run: dotnet --info
    - name: Restore
      run: .\restore.cmd
    - name: Build
      run: .\build.cmd
    - name: Package
      run: .\package.cmd

  build-nix:
    strategy:
      matrix:
        platform: [ 'ubuntu-latest', 'macos-latest' ]

    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
    - run: dotnet --info
    - name: Restore
      run: ./restore.sh
    - name: Build
      run: ./build.sh
    - name: Package
      run: ./package.sh
